<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>手機版檢查</title>
  <!--
    檢查點二・手機版：從首頁出發找出每一頁（含每個縣市、類別、年齡結果頁），
    各用 320px 和 375px 寬打開，檢查有沒有左右捲動、有沒有停在「載入中」。
    要透過網址打開（本機預覽 http://localhost:8123/tools/check-mobile.html，
    或線上 作品連結/tools/check-mobile.html），雙擊檔案打開時瀏覽器不讓它讀其他頁面。
    結果也寫在 <body data-status>（running / pass / fail）和頁面標題，方便自動讀取。
  -->
  <style>
    :root { --paper: #f6f1e6; --ink: #2b2620; --soft: #5e554a; --rule: #d6cbb5; --ok: #3f6b3a; --bad: #a2452f; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1.5rem 1rem 3rem; background: var(--paper); color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.7; }
    main { max-width: 48rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    #summary { font-size: 1.125rem; font-weight: 700; margin: 1rem 0; }
    [data-status="pass"] #summary { color: var(--ok); }
    [data-status="fail"] #summary { color: var(--bad); }
    button { font: inherit; padding: 0.4rem 1rem; border: 1px solid var(--rule); border-radius: 4px; background: #fffdf8; cursor: pointer; }
    ul { padding-left: 1.25rem; }
    .problems li { color: var(--bad); margin-bottom: 0.5rem; }
    .problems small { display: block; color: var(--soft); overflow-wrap: anywhere; }
    details { margin-top: 1.5rem; color: var(--soft); font-size: 0.875rem; }
    #stage { position: fixed; left: -10000px; top: 0; } /* 檢查用的小視窗放在畫面外 */
    #stage iframe { height: 700px; border: 0; display: block; }
  </style>
</head>
<body data-status="running">
  <main>
    <h1>手機版檢查</h1>
    <p>每一頁都用 320px 和 375px 寬打開，檢查：沒有左右捲動、內容不會停在「載入中」。</p>
    <p id="summary">檢查中…</p>
    <button id="rerun" type="button" hidden>重新檢查</button>
    <ul class="problems" id="problems"></ul>
    <details>
      <summary>檢查過的頁面</summary>
      <ul id="checked"></ul>
    </details>
  </main>
  <div id="stage" aria-hidden="true"></div>

  <script>
    const WIDTHS = [320, 375];
    const PARALLEL = 4;
    const SITE = new URL('../', location.href); // 網站根目錄（本機和線上都適用）

    const $ = (id) => document.getElementById(id);
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    /** 從首頁出發，找出所有站內網頁（網址參數不同算不同頁，例如每個縣市各一頁） */
    async function findPages() {
      const pages = [];
      const seen = new Set();
      const queue = ['index.html'];
      const fetched = new Map(); // 同一個 .html 檔只下載一次
      while (queue.length) {
        const page = queue.shift();
        if (seen.has(page)) continue;
        seen.add(page);
        pages.push(page);
        const file = page.split(/[?#]/)[0];
        if (!fetched.has(file)) {
          const res = await fetch(new URL(file, SITE), { cache: 'no-cache' });
          if (!res.ok) throw new Error(`${file} 打不開（${res.status}）`);
          fetched.set(file, await res.text());
        }
        const doc = new DOMParser().parseFromString(fetched.get(file), 'text/html');
        for (const a of doc.querySelectorAll('a[href]')) {
          const url = new URL(a.getAttribute('href'), new URL(file, SITE));
          url.hash = '';
          if (url.origin !== SITE.origin || !url.pathname.startsWith(SITE.pathname)) continue;
          if (!url.pathname.endsWith('.html')) continue;
          const rel = decodeURIComponent(url.pathname.slice(SITE.pathname.length)) + url.search;
          if (!seen.has(rel)) queue.push(rel);
        }
      }
      return pages;
    }

    /** 用指定寬度打開一頁，回傳發現的問題（沒問題就是空陣列） */
    async function checkPage(page, width) {
      const frame = document.createElement('iframe');
      frame.style.width = `${width}px`;
      $('stage').append(frame);
      try {
        await new Promise((resolve, reject) => {
          frame.onload = resolve;
          frame.onerror = reject;
          frame.src = new URL(page, SITE).href;
        });
        const doc = frame.contentDocument;
        await Promise.race([doc.fonts.ready, wait(3000)]); // 字型載入後版面才會定下來
        await wait(300);

        const problems = [];
        const root = doc.documentElement;
        if (root.scrollWidth > root.clientWidth) {
          const wide = [...doc.body.querySelectorAll('*')]
            .filter((el) => el.getBoundingClientRect().right > root.clientWidth + 1)
            .slice(0, 3)
            .map(describe);
          problems.push(`會左右捲動：頁面寬 ${root.scrollWidth}px，畫面只有 ${root.clientWidth}px。超出的元素：${wide.join('、')}`);
        }
        const loading = doc.querySelectorAll('.placeholder');
        if (loading.length) problems.push(`有 ${loading.length} 個區塊停在「載入中」：${[...loading].map((el) => el.textContent.trim()).join('、')}`);
        return problems;
      } finally {
        frame.remove();
      }
    }

    function describe(el) {
      const cls = typeof el.className === 'string' && el.className.trim() ? '.' + el.className.trim().split(/\s+/).join('.') : '';
      return `<${el.tagName.toLowerCase()}${cls}>`;
    }

    function addItem(list, text, detail) {
      const li = document.createElement('li');
      li.textContent = text;
      if (detail) {
        const small = document.createElement('small');
        small.textContent = detail;
        li.append(small);
      }
      $(list).append(li);
    }

    async function run() {
      document.body.dataset.status = 'running';
      $('rerun').hidden = true;
      $('problems').replaceChildren();
      $('checked').replaceChildren();
      $('summary').textContent = '找出所有頁面中…';

      let pages;
      try {
        pages = await findPages();
      } catch (err) {
        finish('fail', `✖ 讀不到網站頁面：${err.message}。請用網址打開這一頁（本機預覽或線上作品連結），不要直接雙擊檔案。`);
        return;
      }

      const jobs = WIDTHS.flatMap((width) => pages.map((page) => ({ page, width })));
      let done = 0;
      let failed = 0;
      const worker = async () => {
        while (jobs.length) {
          const { page, width } = jobs.shift();
          let problems;
          try {
            problems = await checkPage(page, width);
          } catch {
            problems = ['打不開這一頁'];
          }
          done++;
          if (problems.length) {
            failed++;
            addItem('problems', `${width}px｜${page}`, problems.join('；'));
          }
          addItem('checked', `${problems.length ? '✖' : '✔'} ${width}px｜${page}`);
          $('summary').textContent = `檢查中…（${done}／${WIDTHS.length * pages.length}）`;
        }
      };
      await Promise.all(Array.from({ length: PARALLEL }, worker));

      const total = WIDTHS.length * pages.length;
      if (failed) finish('fail', `✖ ${total} 次檢查中有 ${failed} 次有問題（${pages.length} 頁 × ${WIDTHS.join('、')}px）`);
      else finish('pass', `✔ 全部通過：${pages.length} 頁 × ${WIDTHS.join('、')}px，共 ${total} 次檢查`);
    }

    function finish(status, message) {
      document.body.dataset.status = status;
      $('summary').textContent = message;
      document.title = `${status === 'pass' ? '✔' : '✖'} 手機版檢查`;
      $('rerun').hidden = false;
    }

    $('rerun').addEventListener('click', run);
    run();
  </script>
</body>
</html>
